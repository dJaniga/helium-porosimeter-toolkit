[project]
name = "helium-porosimeter-toolkit"
version = "0.1.0"
description = "Calibration and measurement calculations for the Corexport Extended Range Helium Porosimeter (HMPoRZ)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
porosimeter = "porosimeter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porosimeter"]
